<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - KSP Maju Bersama</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                margin: 0;
                font-family: "Segoe UI", Arial, sans-serif;
                font-size: 15px;
                line-height: 1.6;
                color: #1e2533;
                background: linear-gradient(135deg, #2a4673 0%, #3a63a0 50%, #4a7bbf 100%);
            }

            h1 {
                margin: 0 0 4px 0;
                font-size: 21px;
                color: #3a63a0;
            }

            p {
                margin: 0 0 12px 0;
            }

            a {
                color: #4a7bbf;
                font-weight: 600;
                text-decoration: none;
                transition: color 0.2s ease;
            }

            a:hover {
                color: #e08e00;
            }

            main {
                display: flex;
                flex: 1;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .login-box {
                width: 380px;
                max-width: 100%;
                padding: 34px 34px 28px 34px;
                text-align: center;
                background-color: #ffffff;
                border: 4px double #d6e1f5;
                border-radius: 18px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            }

            .logo {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 58px;
                height: 58px;
                margin: 0 auto 14px auto;
                font-size: 20px;
                font-weight: 800;
                color: #3a63a0;
                background-color: #f4b400;
                border-radius: 16px;
                box-shadow: 0 6px 14px rgba(244, 180, 0, 0.35);
            }

            .subtitle {
                padding-bottom: 14px;
                font-size: 13px;
                color: #6b7485;
                border-bottom: 2px dotted #cbd8f0;
            }

            form {
                margin-top: 18px;
                text-align: left;
            }

            label {
                display: block;
                margin-bottom: 6px;
                font-size: 14px;
                font-weight: 600;
                color: #3c4556;
            }

            input {
                width: 100%;
                margin-bottom: 16px;
                padding: 11px 13px;
                font-family: inherit;
                font-size: 14px;
                background-color: #fbfcfe;
                border: 1px solid #d3dae6;
                border-radius: 10px;
                transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            }

            input:focus {
                outline: none;
                border-color: #4a7bbf;
                background-color: #ffffff;
                box-shadow: 0 0 0 4px rgba(74, 123, 191, 0.15);
            }

            button {
                width: 100%;
                padding: 12px;
                font-family: inherit;
                font-size: 15px;
                font-weight: 600;
                color: #ffffff;
                background-color: #4a7bbf;
                border: none;
                border-radius: 10px;
                box-shadow: 0 4px 12px rgba(74, 123, 191, 0.3);
                cursor: pointer;
                transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            }

            button:hover {
                background-color: #3a63a0;
                box-shadow: 0 8px 18px rgba(74, 123, 191, 0.35);
                transform: translateY(-2px);
            }

            button:active {
                transform: translateY(0);
            }

            .note {
                margin: 16px 0 0 0;
                font-size: 13px;
                text-align: center;
                color: #6b7485;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="login-box">
                <div class="logo">MB</div>
                <h1>KSP "Maju Bersama"</h1>
                <p class="subtitle">Sistem Informasi Koperasi Simpan Pinjam</p>

                <form action="dashboard.html" method="get">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" />

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" />

                    <button type="submit">Masuk</button>
                </form>
                <p class="note"><a href="index.html">Kembali ke beranda</a></p>
            </div>
        </main>
    </body>
</html>
